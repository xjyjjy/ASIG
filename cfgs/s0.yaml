max_iter: 100000
hrft_start_after_iters: 100000

datasets:
  train:
    name: 360sp_pan_self_proj_fd
    args:
      dataset:
        name: 360sp_pan_ae_argmap_fd
        args: {root_path: /home/zwxionggroup/xiajy/dataset/360/mv/rgb_train/, arg_map_path: /home/zwxionggroup/xiajy/dataset/arg_map_dataset_v2/arg_map_mat}
